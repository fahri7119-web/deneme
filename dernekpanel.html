  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

  const isAdmin=()=>state.role==='admin'; const activeMembers=()=>safe(state.data?.members).filter(m=>m&&!passive(m));

  const distributionRecipientNames=d=>{const raw=canonicalCeliacName(d?.celiac_name||'');const names=raw.split(/[;,\n]+/).map(canonicalCeliacName).filter(Boolean);return [...new Set(names)];};
  const allocationForRecipient=(amount,index,count)=>{const cents=Math.round((Number(amount)||0)*100),base=Math.floor(cents/Math.max(count,1));return qty((index===count-1?cents-base*(count-1):base)/100)};
  const celiacDistributionRecords=rows=>safe(rows).flatMap(d=>{const recipients=distributionRecipientNames(d);const names=recipients.length?recipients:['Çölyaklı bilgisi belirtilmemiş'];return names.map((celiac_name,index)=>({...d,celiac_name,recipient_count:names.length,items:safe(d.items).map(i=>({...i,quantity:allocationForRecipient(i?.quantity,index,names.length)}))}))});

  const familyStatsRows=()=>{const map={};const members=safe(state.data?.members);const ensure=(member,keyOverride)=>{const key=keyOverride||familyKeyFor(member),familyNo=member?familyNoOf(member):'';if(!map[key])map[key]={key,familyNo,members:[],memberIds:new Set(),celiacMap:{},distributionCount:0,total:0,receipts:new Set(),lastDate:'',active:false};const row=map[key];if(member&&!row.memberIds.has(String(member.id))){row.memberIds.add(String(member.id));row.members.push(member);row.active=row.active||!passive(member);memberCeliacs(member).forEach(c=>{const cKey=canonicalCeliacName(c.name).toLocaleLowerCase('tr');if(cKey&&!row.celiacMap[cKey])row.celiacMap[cKey]=c})}return row};activeMembers().forEach(m=>ensure(m));safe(state.data?.distributions).forEach(d=>{const member=members.find(m=>m.id===d.member_id),row=ensure(member,member?undefined:'member:'+String(d.member_id||'unknown'));row.distributionCount++;row.total=qty(row.total+safe(d.items).reduce((sum,i)=>sum+(Number(i?.quantity)||0),0));if(d.receipt_number)row.receipts.add(d.receipt_number);if(String(d.distribution_date||'')>String(row.lastDate||''))row.lastDate=d.distribution_date||''});return Object.values(map).map(row=>{const celiacNames=Object.values(row.celiacMap).map(c=>c.name),memberNames=row.members.map(name).filter(Boolean);return {...row,celiacNames,memberNames,familyLabel:row.familyNo?'Aile '+row.familyNo:(memberNames.length?'Aile no yok · '+memberNames.join(' · '):'Aile no yok'),celiacCount:celiacNames.length,count:row.distributionCount}}).filter(row=>row.celiacCount>0||row.distributionCount>0).sort((a,b)=>b.count-a.count||b.total-a.total||a.familyLabel.localeCompare(b.familyLabel,'tr'))};

  const renderGeneralReport=d=>`${reportHeader(d,'FAALİYET RAPORU')}${reportCards(d)}${reportOpeningBlock(d)}${reportSection('1.','GİRİŞ',`Bu rapor, Kırıkkale Çölyak Derneği'nin ${date(d.start)} ile ${date(d.end)} tarihleri arasındaki faaliyetlerini değerlendirmek amacıyla hazırlanmıştır. Hesaplamalarda yalnızca seçilen tarih aralığındaki kayıtlar esas alınmış, dönem başı devir bilgileri ayrıca gösterilmiştir.`,reportAlerts(d))}${reportSection('2.','RAPOR DÖNEMİ ÜYE KAYIT DURUMU',`Seçilen dönemde ${d.stats.newMembers} yeni üye, ${d.stats.nonMemberContacts} üye olmayan/iletişime geçen kişi kaydı bulunmaktadır. Üyelik türü dağılımı dönem içinde oluşturulan kayıtlara göre hesaplanmıştır.`,reportTable(['ÜYELİK TÜRÜ','SAYI'],`<tr><td>Kurucu Üye</td><td>${d.memberTypes.kurucu}</td></tr><tr><td>Asıl Üye</td><td>${d.memberTypes.asil}</td></tr><tr><td>Onursal Üye</td><td>${d.memberTypes.onursal}</td></tr><tr><td>Toplam Üye</td><td>${d.stats.newMembers}</td></tr><tr><td>Üye olmayan / iletişime geçen kişiler</td><td>${d.memberTypes.degil}</td></tr>`)+reportTable(['AD SOYAD','AİLE NO','ÜYELİK TÜRÜ','ÜYELİK TARİHİ','TELEFON','MESLEK','ÇÖLYAKLI SAYISI'],reportRowsMembers(d))+'<p class="analysis">Seçilen dönemde '+d.stats.newMembers+' yeni üye kaydı oluşturulmuştur. Bunların '+d.memberTypes.kurucu+' tanesi kurucu, '+d.memberTypes.asil+' tanesi asıl ve '+d.memberTypes.onursal+' tanesi onursal üyedir. Ayrıca '+d.stats.nonMemberContacts+' kişi dernekle iletişime geçmiş ancak üyelik kaydı bulunmamaktadır.</p>'+reportOpeningBlock(d))}${reportSection('3.','STOK DURUMU VE HAREKETLERİ',`Dönem sonu hesabı: dönem başı + dönemde alınan − dönemde dağıtılan. Ürün eşleştirmesinde yalnızca normalize edilmiş malzeme adı esas alınır; birim sütunu hesaplamaya dahil edilmez ve yalnızca bilgi amaçlı gösterilir. Geçmiş devirler dönem faaliyet toplamına karıştırılmamıştır.`,reportTable(['ÜRÜN','DÖNEM BAŞI','DÖNEMDE ALINAN','DÖNEMDE DAĞITILAN','DÖNEM SONU','BİRİM'],reportRowsStock(d))+reportTable(['ÜRÜN','TARİH','MİKTAR','BİRİM'],reportRowsStockEntries(d))+'<p class="analysis">Toplam stok girişi '+qty(d.stock.reduce((a,x)=>a+x.received,0))+', toplam stok çıkışı '+qty(d.stock.reduce((a,x)=>a+x.distributed,0))+' olarak hesaplanmıştır. '+(d.stock.slice().sort((a,b)=>b.received-a.received)[0]?`En fazla giriş ${reportEsc(d.stock.slice().sort((a,b)=>b.received-a.received)[0].name)} ürününde gerçekleşmiştir.`:'Stok girişi bulunmamaktadır')+' '+(d.stock.slice().sort((a,b)=>b.distributed-a.distributed)[0]?`En fazla dağıtılan ürün ${reportEsc(d.stock.slice().sort((a,b)=>b.distributed-a.distributed)[0].name)} olmuştur.`:'Dağıtım kaydı bulunmamaktadır')+'</p>'+reportAlerts(d))}${reportSection('4.','DAĞITIM FAALİYETLERİ',`Dönem içinde ${d.stats.distributionCount} aile teslimiyle toplam ${qty(d.stats.distributedQuantity)} ürün/ölçü dağıtılmıştır.`,reportTable(['MAKBUZ NO','AİLE NO','ÇÖLYAKLI BİREY','KAYITLI ÜYE','TC KİMLİK NO','TELEFON','TESLİM TARİHİ','TESLİM EDİLEN ÜRÜNLER'],reportRowsDistribution(d))+`<h4>ÜRÜN BAZLI DAĞITIM ÖZETİ</h4>`+reportTable(['ÜRÜN','DAĞITILAN TOPLAM','BİRİM','KAYIT SAYISI'],reportRowsProduct(d))+`<h4>AİLE BAZLI DAĞITIM ÖZETİ</h4>`+reportTable(['AİLE','AİLEDEKİ KAYITLAR','ÇÖLYAKLILAR','AİLE TESLİMİ','TOPLAM ÜRÜN PAYI','MAKBUZLAR','ALINAN ÜRÜNLER'],reportRowsFamilyDist(d))+`<p class="analysis">Toplam aile teslimi ${d.stats.distributionCount}, toplam dağıtılan ürün ${qty(d.stats.distributedQuantity)}. ${d.familyDistribution[0]?`En fazla dağıtım alan aile ${reportEsc(d.familyDistribution[0].familyLabel)} olmuştur.`:'Dağıtım alan aile bulunmamaktadır.'} ${d.neverDistributedFamilies.length?`Hiç aile teslimi almayan aktif çölyaklı aile sayısı ${d.neverDistributedFamilies.length}.`:'Tüm aktif çölyaklı ailelerin en az bir aile teslim kaydı bulunmaktadır veya dönem verisi yoktur.'}</p><h4>EN AZ DAĞITIM ALAN 20 AİLE</h4>${reportTable(['AİLE','AİLEDEKİ ÇÖLYAKLI SAYISI','AİLE TESLİMİ','TOPLAM ÜRÜN'],d.familyDistribution.slice().sort((a,b)=>a.count-b.count).slice(0,20).map(x=>`<tr><td>${reportEsc(x.familyLabel)}</td><td>${x.celiacCount}</td><td>${x.count}</td><td>${x.total}</td></tr>`).join(''))}`)}${reportSection('5.','GELİR-GİDER RAPORU',`Dönem başı bakiye ${reportMoney(d.financial.openingBalance)}; dönem geliri ${reportMoney(d.financial.totalIncome)}; dönem gideri ${reportMoney(d.financial.totalExpense)}; dönem sonu/kapanış bakiyesi ${reportMoney(d.financial.closingBalance)}.`,`<div class="report-finance-summary">${reportCard('Toplam Gelir',reportMoney(d.financial.totalIncome),'Transfer hariç')}${reportCard('Toplam Gider',reportMoney(d.financial.totalExpense),'Transfer hariç','clay')}${reportCard('Net Sonuç',reportMoney(d.financial.netResult),'Dönem sonucu','ink')}${reportCard('Dönem Sonu Bakiye',reportMoney(d.financial.closingBalance),'Devir dahil','gold')}</div><h4>Gelir Kategorileri</h4>${reportTable(['KATEGORİ','TUTAR'],Object.entries(d.financial.incomeCats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${reportEsc(k)}</td><td>${reportMoney(v)}</td></tr>`).join(''))}<h4>Gider Kategorileri</h4>${reportTable(['KATEGORİ','TUTAR'],Object.entries(d.financial.expenseCats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${reportEsc(k)}</td><td>${reportMoney(v)}</td></tr>`).join(''))}<h4>Gelir Detay Tablosu</h4>${reportTable(['TARİH','GELİR TÜRÜ','ÖDEME YÖNTEMİ','ÖDEMEYİ YAPAN','AÇIKLAMA','TUTAR'],reportRowsFinance(d.income,d,'income'))}<h4>Gider Detay Tablosu</h4>${reportTable(['TARİH','GİDER TÜRÜ','ÖDEME YÖNTEMİ','ÖDEMEYİ YAPAN','AÇIKLAMA','TUTAR'],reportRowsFinance(d.expenses,d,'expense'))}<h4>Transferler</h4>${reportTable(['TARİH','YÖN','YÖNTEM','TUTAR','AÇIKLAMA'],reportRowsTransfers(d))}<p class="analysis">Banka → Kasa toplamı ${reportMoney(d.financial.bankToCash)}, Kasa → Banka toplamı ${reportMoney(d.financial.cashToBank)}. Transfer çiftleri normal gelir/gider toplamlarına dahil edilmemiştir.</p>`)}${reportSection('6.','SONUÇ VE DEĞERLENDİRME',reportConclusion(d),'')}${reportChartsBlock()}${reportFooter()}`;
  const renderActivityReport=d=>`${reportHeader(d,'FAALİYET RAPORU')}${reportCards(d)}${reportSection('1.','DÖNEM ÖZETİ',`Seçilen dönemde ${d.stats.newMembers} yeni üye, ${d.stats.stockEntryCount} stok girişi ve ${d.stats.distributionCount} aile teslimi gerçekleşmiştir.`,reportOpeningBlock(d)+reportTable(['FAALİYET GÖSTERGESİ','DEĞER'],`<tr><td>Yeni üye</td><td>${d.stats.newMembers}</td></tr><tr><td>Üye olmayan iletişim</td><td>${d.stats.nonMemberContacts}</td></tr><tr><td>Stok girişi</td><td>${d.stats.stockEntryCount}</td></tr><tr><td>Aile teslimi</td><td>${d.stats.distributionCount}</td></tr><tr><td>Finansal hareket</td><td>${d.stats.financialMovementCount}</td></tr>`))}${reportSection('2.','ÜYELİK VE SOSYAL DESTEK',`Dönem içinde ${d.stats.newMembers} yeni üye ve ${d.stats.nonMemberContacts} iletişim kaydı oluşmuştur.`,reportTable(['AD SOYAD','AİLE NO','ÜYELİK TÜRÜ','TARİH','TELEFON','MESLEK','ÇÖLYAKLI'],reportRowsMembers(d))+reportTable(['AİLE','AİLEDEKİ ÇÖLYAKLI SAYISI','AİLE TESLİMİ','TOPLAM ÜRÜN PAYI'],d.familyDistribution.map(x=>`<tr><td>${reportEsc(x.familyLabel)}</td><td>${x.celiacCount}</td><td>${x.count}</td><td>${x.total}</td></tr>`).join('')))}${reportSection('3.','FAALİYETLER VE SONUÇ',reportConclusion(d),reportTable(['ÜRÜN','DAĞITILAN','BİRİM'],reportRowsProduct(d))+reportFooter())}`;
  const renderFinancialReport=d=>`${reportHeader(d,'MALİ RAPOR')}${reportCards(d)}${reportOpeningBlock(d)}${reportSection('1.','MALİ ÖZET',`Dönem başı net bakiye ${reportMoney(d.financial.openingBalance)} + dönem geliri ${reportMoney(d.financial.totalIncome)} − dönem gideri ${reportMoney(d.financial.totalExpense)} = dönem sonu bakiye ${reportMoney(d.financial.closingBalance)}.`,reportTable(['GÖSTERGE','TUTAR'],`<tr><td>Toplam gelir</td><td>${reportMoney(d.financial.totalIncome)}</td></tr><tr><td>Toplam gider</td><td>${reportMoney(d.financial.totalExpense)}</td></tr><tr><td>Net sonuç</td><td>${reportMoney(d.financial.netResult)}</td></tr><tr><td>Dönem başı bakiye</td><td>${reportMoney(d.financial.openingBalance)}</td></tr><tr><td>Dönem sonu bakiye</td><td>${reportMoney(d.financial.closingBalance)}</td></tr>`))}${reportSection('2.','GELİRLER',`Gelirler seçilen tarih aralığında ve transferler ayrı tutularak gösterilmiştir.`,reportTable(['TARİH','GELİR TÜRÜ','ÖDEME YÖNTEMİ','ÖDEMEYİ YAPAN','AÇIKLAMA','TUTAR'],reportRowsFinance(d.income,d,'income'))+reportTable(['KATEGORİ','TUTAR'],Object.entries(d.financial.incomeCats).map(([k,v])=>`<tr><td>${reportEsc(k)}</td><td>${reportMoney(v)}</td></tr>`).join('')))}${reportSection('3.','GİDERLER',`Gider kategorileri ve ayrıntılı işlemler aşağıdadır.`,reportTable(['TARİH','GİDER TÜRÜ','ÖDEME YÖNTEMİ','ÖDEMEYİ YAPAN','AÇIKLAMA','TUTAR'],reportRowsFinance(d.expenses,d,'expense'))+reportTable(['KATEGORİ','TUTAR'],Object.entries(d.financial.expenseCats).map(([k,v])=>`<tr><td>${reportEsc(k)}</td><td>${reportMoney(v)}</td></tr>`).join('')))}${reportSection('4.','TRANSFERLER VE DEĞERLENDİRME',`Banka → Kasa toplamı ${reportMoney(d.financial.bankToCash)}, Kasa → Banka toplamı ${reportMoney(d.financial.cashToBank)}. Transferler normal gelir/gider toplamlarına dahil edilmemiştir.`,reportTable(['TARİH','YÖN','YÖNTEM','TUTAR','AÇIKLAMA'],reportRowsTransfers(d))+`<p class="analysis">${reportConclusion(d)}</p>`)}`;
  const renderMemberReport=d=>`${reportHeader(d,'ÜYE RAPORU')}${reportCards(d)}${reportSection('1.','ÜYELİK TÜRÜ DAĞILIMI',`Dönem kayıtlarında toplam ${d.stats.newMembers} üye ve ${d.stats.nonMemberContacts} üye olmayan iletişim kaydı bulunmaktadır.`,reportTable(['ÜYELİK TÜRÜ','SAYI'],`<tr><td>Kurucu Üye</td><td>${d.memberTypes.kurucu}</td></tr><tr><td>Asıl Üye</td><td>${d.memberTypes.asil}</td></tr><tr><td>Onursal Üye</td><td>${d.memberTypes.onursal}</td></tr><tr><td>Toplam Üye</td><td>${d.stats.newMembers}</td></tr><tr><td>Üye olmayan / iletişime geçen</td><td>${d.memberTypes.degil}</td></tr>`))}${reportSection('2.','AYRINTILI ÜYE TABLOSU',`Telefon ve T.C. bilgileri rapor türü ve yetkiye göre maskelenir. Meslek alanı mevcut veri yapısında bulunmuyorsa “Belirtilmemiş” gösterilir.`,reportTable(['AD SOYAD','AİLE NO','ÜYELİK TÜRÜ','ÜYELİK TARİHİ','TELEFON','MESLEK','ÇÖLYAKLI SAYISI'],reportRowsMembers(d)))}${reportSection('3.','DÖNEM BAŞI / DÖNEM SONU',`Dönem başlangıcından önceki kayıtlar devir olarak, dönem içi yeni kayıtlar faaliyet olarak ayrı hesaplanmıştır.`,reportOpeningBlock(d)+`<p class="analysis">Seçilen dönemde ${d.stats.newMembers} yeni üye kaydı oluşturulmuştur. Bunların ${d.memberTypes.kurucu} tanesi kurucu, ${d.memberTypes.asil} tanesi asıl ve ${d.memberTypes.onursal} tanesi onursal üyedir.</p>`)}`;

  const renderSelectedReport=d=>{if(!d)return`<div class="report-empty"><h2>Rapor önizlemesi hazır değil</h2><p>Başlangıç ve bitiş tarihini seçip “Rapor Oluştur” düğmesine basın.</p></div>`;if(reportKind==='activity')return renderActivityReport(d);if(reportKind==='financial')return renderFinancialReport(d);if(reportKind==='member')return renderMemberReport(d);if(reportKind==='stock')return renderStockReport(d);return renderGeneralReport(d)};
  const reportControls=()=>{const s=reportDataCache?.start||reportDefaultStart(),e=reportDataCache?.end||reportDefaultEnd();return `<div class="report-tools"><div><p class="eyebrow">RAPOR MERKEZİ</p><p class="report-subtitle">Metin dosyasındaki kurumsal rapor türleri ve dönem hesapları tek merkezden üretilir.</p></div><div class="date-form"><label>BAŞLANGIÇ TARİHİ<input id="reportStart" type="date" value="${s}"></label><label>BİTİŞ TARİHİ<input id="reportEnd" type="date" value="${e}"></label><label>RAPOR TÜRÜ<select id="reportType" onchange="reportKind=this.value;if(reportDataCache)refreshReportPreview()">${Object.entries(reportTypes).map(([k,v])=>`<option value="${k}" ${reportKind===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><button type="button" class="primary" onclick="createReport(event)">✓ Rapor Oluştur</button><button type="button" class="row-btn" onclick="previewReport(event)">◉ Önizleme</button><button type="button" class="row-btn" onclick="printReport()">▣ Yazdır</button><button type="button" class="row-btn" onclick="exportReportWord()">W Word olarak indir</button><button type="button" class="row-btn" onclick="printReport()">PDF olarak indir</button><button type="button" class="row-btn" onclick="exportReportExcel()">▤ Excel olarak indir</button></div></div>`};
  const reports=()=>`${head('Rapor Oluştur','Gerçek Supabase kayıtlarından; devir, dönem hareketi ve sonuçları birbirine karıştırmadan kurumsal rapor hazırlayın.')}${reportControls()}<article class="report" id="reportPaper">${renderSelectedReport(reportDataCache)}</article>`;
  const readReportDates=()=>{const s=document.getElementById('reportStart')?.value||'',e=document.getElementById('reportEnd')?.value||'';if(!s||!e){toast('Başlangıç ve bitiş tarihleri zorunludur.',true);return null}if(s>e){toast('Başlangıç tarihi bitiş tarihinden sonra olamaz.',true);return null}if(state.loading||!state.dataLoaded){toast('Supabase verileri henüz yüklenmedi; lütfen tekrar deneyin.',true);return null}if(state.dataError){toast('Supabase verileri yüklenemedi: '+err(state.dataError),true);return null}return{s,e}};

,d.financial.openingBalance],['Toplam Gelir',d.financial.totalIncome],['Toplam Gider',d.financial.totalExpense],['Net Sonuç',d.financial.netResult],['Dönem Sonu Bakiye',d.financial.closingBalance],['Banka → Kasa',d.financial.bankToCash],['Kasa → Banka',d.financial.cashToBank]]}};

  function backup(){return `${head('Kayıtların güvencesi','Dışa aktarma mevcut veriyi değiştirmez; içe aktarma yeni kayıtları ekler.')}<div class="backup-grid"><article class="backup-card hero-backup"><p class="eyebrow" style="color:#d7ebdf">TAM YEDEK</p><h3>Tüm kayıtları<br><em>tek dosyada saklayın.</em></h3><p>Üyeler, stok, dağıtımlar, planlar ve mali defter tek JSON dosyasında hazırlanır.</p><button class="primary" onclick="exportJson()">⇩ JSON yedek indir</button></article><article class="backup-card"><h3>Tablo dışa aktarımı</h3><p>Üye listesini elektronik tablo veya CSV uyumlu olarak indirin.</p><div class="actions"><button class="row-btn" onclick="exportCsv()">⇩ CSV indir</button><button class="row-btn" onclick="exportExcel()">⇩ Excel indir</button></div></article><article class="backup-card"><h3>JSON içe aktar</h3><p>Daha önce alınmış yedeği yeni kayıtlar ekleyerek geri yükleyin.</p><input id="importFile" type="file" accept=".json,application/json" style="margin-top:14px;font-size:10px"><button class="primary" onclick="importJson()">⇧ Dosyayı aktar</button></article></div><div class="notice"><b>!</b><div><strong>İçe aktarma notu</strong><br>JSON içeriği mevcut kayıtlara eklenir. Aynı yedeği tekrar aktarmadan önce kayıt tekrarlarını kontrol edin.</div></div>`}

  function memberModal(m={}){modal(m.id?'Üye kaydını düzenle':'Yeni üye kaydı','Üye bilgileri ile destekten yararlanacak çölyaklı bireyler aynı kayıtta tutulur. Her birey ayrı satırda tutulduğu için kayıtları sonradan kolayca düzenleyebilirsiniz.',`<div class="form-grid"><label class="field">Ad<input required name="first_name" value="${esc(m.first_name||'')}"></label><label class="field">Soyad<input required name="last_name" value="${esc(m.last_name||'')}"></label><label class="field">Aile no<input name="aile_no" type="number" min="1" step="1" value="${esc(m.aile_no??'')}" placeholder="Aynı aile için aynı numara"></label><label class="field">T.C. Kimlik No<input name="tc_id" maxlength="11" value="${esc(m.tc_id||'')}"></label><label class="field">Telefon<input name="phone" value="${esc(m.phone||'')}"></label><label class="field">Üyelik türü<select name="member_type">${['kurucu','asil','onursal','degil'].map(x=>`<option value="${x}" ${m.member_type===x?'selected':''}>${x==='kurucu'?'Kurucu':x==='asil'?'Asıl':x==='onursal'?'Onursal':'Üye değil'}</option>`).join('')}</select></label><label class="field">Üyelik tarihi<input name="membership_date" type="date" value="${esc(m.membership_date||today())}"></label><div class="field wide"><span>Çölyaklı birey bilgileri</span><div id="memberCeliacRows" class="celiac-lines">${celiacInputRows(memberCeliacRows(m))}</div><div class="inline-actions"><button type="button" class="row-btn" onclick="addCeliacRow()">＋ Çölyaklı birey ekle</button></div><p class="repeat-note">Her satıra bir kişinin adı, soyadı ve üyeye yakınlığı yazılır. İhtiyaç oldukça yeni satır ekleyebilirsiniz.</p></div><label class="field wide">Açıklama<textarea name="description">${esc(m.description||'')}</textarea></label><label class="field"><span><input type="checkbox" name="is_passive" ${passive(m)?'checked':''} style="width:auto"> Üyeyi pasif işaretle</span></label></div>`,`saveMember(event,'${m.id||''}')`)}
  function stockModal(x={}){modal(x.id?'Stok girişini düzenle':'Stok girişi','Dağıtım yapılmadıysa alınan ve kalan miktar aynı olmalıdır.',`<div class="form-grid"><label class="field">Ürün adı<input required name="product_name" value="${esc(x.product_name||'')}"></label><label class="field">Giriş tarihi<input required name="entry_date" type="date" value="${esc(x.entry_date||today())}"></label><label class="field">Alınan miktar<input required name="received_quantity" type="number" min="0" step=".01" value="${x.received_quantity??1}"></label><label class="field">Kalan miktar<input required name="remaining_quantity" type="number" min="0" step=".01" value="${x.remaining_quantity??1}"></label><label class="field">Birim<select name="unit">${['Adet','Kg','Litre','Paket'].map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div>`,`saveStock(event,'${x.id||''}')`)}

  function planModal(x={}){const editing=Boolean(x.id),selected=distributionRecipientNames(x);modal(editing?'Dağıtım planını düzenle':'Dağıtım planı oluştur','Plan stok yetersizliği olsa da kaydedilir; teslimde kesin kontrol yapılır. Aynı plana birden fazla ürün ve çölyaklı birey ekleyebilirsiniz.',`<div class="form-grid"><label class="field">Üye${memberSelect('member_id','updatePlanRecipients(this.value)',x.member_id||'')}</label><label class="field">Plan tarihi<input required name="planned_date" type="date" value="${esc(x.planned_date||today())}"></label><div class="field wide"><span>Çölyaklı bireyler</span><div id="planRecipients" class="celiac-empty">${x.member_id?'Seçili üyenin çölyaklıları yükleniyor…':'Önce üyeyi seçin veya aşağıdaki alana elle yazın.'}</div></div><label class="field wide">Çölyaklı adı / grup (isteğe bağlı)<input name="celiac_name_manual" value="${esc(!selected.length?x.celiac_name||'':'')}" placeholder="Seçim yoksa elle yazabilirsiniz"></label></div><div id="planItems" class="item-list">${safe(x.items).length?safe(x.items).map(i=>itemInputLine(i,safe(x.items).length>1)).join(''):itemInputLine()}</div><div class="inline-actions"><button type="button" class="row-btn" onclick="addItemRow('planItems')">＋ Ürün ekle</button></div><label class="field">Plan notu<textarea name="notes">${esc(x.notes||'')}</textarea></label>`,`savePlan(event,'${x.id||''}')`);if(x.member_id)updatePlanRecipients(x.member_id,selected)}
  function financeCategories(type,selected=''){return (type==='Gelir'?['Aidat','Bağış','Diğer']:['Faaliyet','Proje','Gıda Alımı','Kırtasiye','Hizmet','Banka Hizmetleri','Diğer']).map(x=>`<option value="${x}" ${x===selected?'selected':''}>${x}</option>`).join('')}
  function financialModal(x={}){const editing=Boolean(x.id),type=x.type||'Gelir',category=type==='Gelir'?(x.income_type||'Aidat'):(x.expense_type||'Faaliyet');modal(editing?'Mali işlemi düzenle':'Mali işlem ekle','Gelir ve giderler banka veya makbuz/kasa yöntemine göre bakiyeye yansır.',`<div class="form-grid"><label class="field">İşlem türü<select name="type" onchange="this.form.querySelector('[name=category]').innerHTML=financeCategories(this.value)"><option value="Gelir" ${type==='Gelir'?'selected':''}>Gelir</option><option value="Gider" ${type==='Gider'?'selected':''}>Gider</option></select></label><label class="field">Tarih<input name="date" type="date" value="${esc(x.date||today())}"></label><label class="field">Kategori<select name="category">${financeCategories(type,category)}</select></label><label class="field">Ödeme yöntemi<select name="payment_method"><option value="Banka" ${x.payment_method==='Banka'?'selected':''}>Banka</option><option value="Makbuz" ${x.payment_method==='Makbuz'?'selected':''}>Makbuz / Kasa</option></select></label><label class="field">Tutar (₺)<input required name="amount" type="number" min=".01" step=".01" value="${x.amount??''}"></label><label class="field">Ödemeyi yapan kişi<input name="payer_name" value="${esc(x.payer_name||'')}"></label><label class="field wide">Açıklama<textarea name="description">${esc(x.description||'')}</textarea></label></div>`,`saveFinancial(event,'${x.id||''}')`)}

  async function saveMember(e,id){if(!requireAdmin())return;let f=new FormData(e.target),names=f.getAll('celiac_name'),surnames=f.getAll('celiac_surname'),relations=f.getAll('celiac_relation'),seen=new Set(),cel=names.map((value,index)=>({name:String(value||'').trim(),surname:String(surnames[index]||'').trim(),relation:String(relations[index]||'').trim()})).filter(x=>x.name||x.surname||x.relation).filter(x=>{const key=(x.name+'|'+x.surname+'|'+x.relation).toLocaleLowerCase('tr');if(seen.has(key))return false;seen.add(key);return true});let p=Object.fromEntries(f),familyNo=String(f.get('aile_no')||'').trim();p.aile_no=familyNo?Number(familyNo):null;p.celiacs=cel;p.is_passive=f.get('is_passive')==='on';delete p.celiac_name;delete p.celiac_surname;delete p.celiac_relation;try{let r=id?await db.from('members').update(p).eq('id',id):await db.from('members').insert(p);if(r.error)throw r.error;closeModal();toast('Üye kaydı, aile numarası ve çölyaklı birey listesi kaydedildi.');load()}catch(x){toast(err(x),true)}}
  async function saveStock(e,id){let f=Object.fromEntries(new FormData(e.target));f.product_name=productNameDisplay(f.product_name);f.unit=unitDisplay(f.unit);f.received_quantity=qty(f.received_quantity);f.remaining_quantity=qty(f.remaining_quantity);if(f.remaining_quantity>f.received_quantity){toast('Kalan miktar alınan miktardan fazla olamaz.',true);return}try{let r=id?await db.from('stock').update(f).eq('id',id):await db.from('stock').insert(f);if(r.error)throw r.error;closeModal();toast('Stok kaydı kaydedildi.');load()}catch(x){toast(err(x),true)}}
  async function consumeStock(item){const need0=qty(item.quantity),unit=item.unit||null;if(!item.productName||need0<=0)throw new Error('Ürün ve miktar bilgisi zorunludur.');if(stockAmount(item.productName,unit)<need0)throw new Error(item.productName+' için yeterli stok bulunmuyor.');let need=need0;const lots=[...state.data.stock].filter(x=>productNameNorm(x.product_name)===productNameNorm(item.productName)&&(!unit||unitNorm(x.unit)===unitNorm(unit))&&Number(x.remaining_quantity)>0).sort((a,b)=>String(a.entry_date||'').localeCompare(String(b.entry_date||'')));for(const lot of lots){if(need<=0)break;const have=qty(lot.remaining_quantity),use=qty(Math.min(need,have)),left=qty(have-use),r=await db.from('stock').update({remaining_quantity:left}).eq('id',lot.id);if(r.error)throw r.error;const local=state.data.stock.find(s=>s.id===lot.id);if(local)local.remaining_quantity=left;need=qty(need-use)}if(need>0.001)throw new Error(item.productName+' için stok yetersiz kaldı.')}
  async function restoreStock(item){const amount=qty(item.quantity);if(!amount)return;const lot=[...state.data.stock].filter(x=>productNameNorm(x.product_name)===productNameNorm(item.productName)&&unitNorm(x.unit)===unitNorm(item.unit)).sort((a,b)=>String(a.entry_date||'').localeCompare(String(b.entry_date||'')))[0];if(!lot)throw new Error(item.productName+' için stok lotu bulunamadı; dağıtım düzenlenemedi.');const left=qty(Number(lot.remaining_quantity||0)+amount),r=await db.from('stock').update({remaining_quantity:left}).eq('id',lot.id);if(r.error)throw r.error;const local=state.data.stock.find(s=>s.id===lot.id);if(local)local.remaining_quantity=left}
  async function fifo(member_id,celiac_name,distribution_date,item,receipt){await consumeStock(item);const r=await db.from('distributions').insert({receipt_number:receipt,member_id,celiac_name,distribution_date,items:[{...item,quantity:qty(item.quantity)}]});if(r.error)throw r.error}
  const readFormItems=form=>{const products=form.getAll('productName'),quantities=form.getAll('quantity'),units=form.getAll('unit'),items=[];products.forEach((product,index)=>{const productValue=productNameDisplay(product),amount=Number(quantities[index]),unit=unitDisplay(units[index]);if(productValue&&Number.isFinite(amount)&&amount>0)items.push({productName:productValue,quantity:qty(amount),unit})});return items};
  const mergeItems=items=>{const map={};items.forEach(item=>{const key=productNameNorm(item.productName)+'||'+unitNorm(item.unit);if(!map[key])map[key]={...item,quantity:0};map[key].quantity=qty(map[key].quantity+Number(item.quantity||0))});return Object.values(map)};
  const generatedReceipt=()=>`DG-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;
  async function saveDistribution(e,id=''){if(!requireAdmin())return;const form=new FormData(e.target),recipients=[...new Set(form.getAll('celiac_recipient').map(canonicalCeliacName).filter(Boolean))],items=mergeItems(readFormItems(form)),memberId=form.get('member_id'),distributionDate=form.get('distribution_date'),receipt=String(form.get('receipt_number')||'').trim()||generatedReceipt();if(!recipients.length){toast('Dağıtım kaydı için en az bir çölyaklı birey seçin.',true);return}if(!items.length){toast('En az bir ürün ve geçerli miktar girin.',true);return}try{const old=id?state.data.distributions.find(x=>String(x.id)===String(id)):null;if(old)for(const item of safe(old.items))await restoreStock(item);for(const item of items)await consumeStock(item);const payload={receipt_number:receipt,member_id:memberId,celiac_name:recipients.join('; '),distribution_date:distributionDate,items};const r=id?await db.from('distributions').update(payload).eq('id',id):await db.from('distributions').insert(payload);if(r.error)throw r.error;closeModal();toast(id?'Dağıtım kaydı güncellendi.':'Makbuz '+receipt+' altında dağıtım kaydedildi.');load()}catch(x){toast(err(x),true)}}
  async function savePlan(e,id=''){if(!requireAdmin())return;const form=new FormData(e.target),selected=[...new Set(form.getAll('plan_recipient').map(canonicalCeliacName).filter(Boolean))],manual=canonicalCeliacName(form.get('celiac_name_manual')),items=mergeItems(readFormItems(form));if(!form.get('member_id')||!items.length){toast('Üye ve en az bir ürün bilgisi zorunludur.',true);return}const payload={member_id:form.get('member_id'),celiac_name:selected.join('; ')||manual,planned_date:form.get('planned_date'),notes:form.get('notes')||'',status:'planned',items};try{const r=id?await db.from('distribution_plans').update(payload).eq('id',id):await db.from('distribution_plans').insert(payload);if(r.error)throw r.error;closeModal();toast(id?'Dağıtım planı güncellendi.':(items.some(item=>stockAmount(item.productName,item.unit)<item.quantity)?'Plan stok uyarısıyla kaydedildi.':'Dağıtım planı kaydedildi.'));load()}catch(x){toast(err(x),true)}}
  async function deliverPlan(id){if(!requireAdmin())return;let x=state.data.plans.find(a=>a.id===id);if(!x)return;try{for(const item of safe(x.items))await fifo(x.member_id,x.celiac_name||'',today(),item,`PLAN-${String(Date.now()).slice(-8)}`);let r=await db.from('distribution_plans').update({status:'delivered'}).eq('id',id);if(r.error)throw r.error;toast('Plan teslim edildi ve stok güncellendi.');load()}catch(e){toast(err(e),true)}}
  async function saveFinancial(e,id=''){if(!requireAdmin())return;let f=Object.fromEntries(new FormData(e.target)),p={date:f.date,type:f.type,payment_method:f.payment_method,payer_name:f.payer_name||'',description:f.description||'',amount:Number(f.amount),income_type:f.type==='Gelir'?f.category:null,expense_type:f.type==='Gider'?f.category:null};if(!p.amount||p.amount<=0){toast('Tutar sıfırdan büyük olmalıdır.',true);return}try{let r=id?await db.from('financial').update(p).eq('id',id):await db.from('financial').insert(p);if(r.error)throw r.error;closeModal();toast(id?'Mali işlem güncellendi.':'Mali işlem kaydedildi.');load()}catch(x){toast(err(x),true)}}
  async function saveTransfer(e){let f=Object.fromEntries(new FormData(e.target)),bank=f.direction==='bank_to_cash',amount=Number(f.amount),d=bank?'[TRANSFER] Banka→Kasa':'[TRANSFER] Kasa→Banka',rows=[{date:f.date,type:'Gider',expense_type:'Transfer',payment_method:bank?'Banka':'Makbuz',description:d+(f.description?' · '+f.description:''),amount},{date:f.date,type:'Gelir',income_type:'Transfer',payment_method:bank?'Makbuz':'Banka',description:d+(f.description?' · '+f.description:''),amount}];try{let r=await db.from('financial').insert(rows);if(r.error)throw r.error;closeModal();toast('Banka · kasa transferi iki yönlü kaydedildi.');load()}catch(x){toast(err(x),true)}}
  function editMember(id){let x=state.data.members.find(a=>a.id===id);if(x)memberModal(x)}
  function editStock(id){let x=state.data.stock.find(a=>a.id===id);if(x)stockModal(x)}
  function editDistribution(id){let x=state.data.distributions.find(a=>String(a.id)===String(id));if(x)distributionModal(x)}
  function editPlan(id){let x=state.data.plans.find(a=>String(a.id)===String(id));if(x)planModal(x)}
  function editFinancial(id){let x=state.data.financial.find(a=>String(a.id)===String(id));if(x)financialModal(x)}
  async function deleteRow(table,id,label){if(!requireAdmin()||!confirm(label+' kaydı kalıcı olarak silinsin mi?'))return;try{let r=await db.from(table).delete().eq('id',id);if(r.error)throw r.error;toast('Kayıt silindi.');load()}catch(x){toast(err(x),true)}}
  function download(content,file,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=file;a.click();URL.revokeObjectURL(u)}function exportJson(){download(JSON.stringify(state.data,null,2),'colyak-dernek-yedek-'+today()+'.json','application/json')}function exportCsv(){let r=[['Ad','Soyad','Üyelik türü','Telefon','Çölyaklı sayısı','Durum'],...state.data.members.map(x=>[x.first_name,x.last_name,x.member_type,x.phone||'',safe(x.celiacs).length,passive(x)?'Pasif':'Aktif'])];download(r.map(x=>x.map(y=>`"${String(y).replaceAll('"','""')}"`).join(',')).join('\n'),'uyeler-'+today()+'.csv','text/csv;charset=utf-8')}function exportExcel(){let r=state.data.members.map(x=>`<tr><td>${esc(x.first_name)}</td><td>${esc(x.last_name)}</td><td>${esc(x.member_type)}</td><td>${esc(x.phone||'')}</td><td>${safe(x.celiacs).length}</td></tr>`).join('');download(`<table><tr><th>Ad</th><th>Soyad</th><th>Tür</th><th>Telefon</th><th>Çölyaklı</th></tr>${r}</table>`,'uyeler-'+today()+'.xls','application/vnd.ms-excel')}
  async function importJson(){if(!requireAdmin())return;let file=document.getElementById('importFile').files[0];if(!file)return toast('Lütfen bir JSON yedek dosyası seçin.',true);try{let o=JSON.parse(await file.text()),pairs=[['members','members'],['stock','stock'],['distributions','distributions'],['plans','distribution_plans'],['financial','financial']];for(let [key,table] of pairs){if(Array.isArray(o[key])&&o[key].length){let r=await db.from(table).insert(o[key]);if(r.error)throw r.error}}toast('Yedek veriler içe aktarıldı.');load()}catch(e){toast('İçe aktarma yapılamadı: '+err(e),true)}}
  db.auth.getSession().then(({data})=>{state.session=data.session;state.role=state.session?.user?.user_metadata?.role==='admin'?'admin':'viewer';render();if(state.session)load()});db.auth.onAuthStateChange((_e,s)=>{state.session=s;state.role=s?.user?.user_metadata?.role==='admin'?'admin':'viewer';render();if(s)load()});
  </script>
