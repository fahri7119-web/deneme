<div class="page-content">
    <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
        <h2 style="color: var(--primary-dark);"><i class="fas fa-users"></i> Yazarlar Yönetimi</h2>
        <button class="btn btn-primary" onclick="openAuthorModal()"><i class="fas fa-plus"></i> Yeni Yazar</button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr style="background: var(--primary-bg);">
                        <th>#</th>
                        <th>Ad Soyad</th>
                        <th>Unvan</th>
                        <th>E-posta</th>
                        <th>Makale Sayısı</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="authorsTableBody">
                    <tr><td colspan="6" class="empty-state">Yükleniyor...</td</tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Yazar Modal -->
    <div id="authorModal" class="modal" style="z-index: 4000;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div class="modal-title" id="authorModalTitle">Yeni Yazar</div>
                <button class="modal-close" onclick="closeAuthorModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="authorModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAuthorModal()">İptal</button>
                <button class="btn btn-primary" onclick="saveAuthor()">Kaydet</button>
            </div>
        </div>
    </div>
</div>

<script>
    let authorsData = [];
    let editingAuthorId = null;

    async function initAuthors() { 
        console.log('initAuthors çağrıldı');
        await loadAuthors(); 
    }

    async function loadAuthors() {
        console.log('Yazarlar yükleniyor...');
        try {
            const { data, error } = await window.supabaseClient
                .from('authors')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            authorsData = data || [];
            console.log('Yazarlar yüklendi:', authorsData.length, 'adet');
            renderAuthors();
        } catch (err) {
            console.error('Yazarlar yüklenirken hata:', err);
            window.showToast('Yazarlar yüklenemedi: ' + err.message, 'error');
        }
    }

    function renderAuthors() {
        const tbody = document.getElementById('authorsTableBody');
        if (!authorsData.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Henüz yazar yok. İlk yazarınızı ekleyin!</td></tr>';
            return;
        }
        
        // Makale sayılarını hesapla
        const articleCounts = {};
        if (window.appData.articles) {
            window.appData.articles.forEach(a => { 
                if (a.author_email) articleCounts[a.author_email] = (articleCounts[a.author_email] || 0) + 1; 
            });
        }
        
        tbody.innerHTML = authorsData.map((author, idx) => {
            const editButton = window.isAdmin() ? `<button class="btn btn-secondary btn-small" onclick="editAuthor('${author.id}')"><i class="fas fa-edit"></i> Düzenle</button>` : '';
            const deleteButton = window.isAdmin() ? `<button class="btn btn-danger btn-small" onclick="deleteAuthor('${author.id}')"><i class="fas fa-trash"></i> Sil</button>` : '';
            
            return `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${window.escapeHtml(author.name)}</strong></td>
                    <td>${window.escapeHtml(author.title) || '-'}</td>
                    <td>${window.escapeHtml(author.email) || '-'}</td>
                    <td>${articleCounts[author.email] || 0}</td>
                    <td class="admin-only">
                        ${editButton}
                        ${deleteButton}
                    </td>
                </tr>
            `;
        }).join('');
    }

    function openAuthorModal() { 
        if (!window.isAdmin()) {
            window.showToast('Bu işlem için admin yetkisi gerekli!', 'error');
            return;
        }
        editingAuthorId = null; 
        document.getElementById('authorModalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Yeni Yazar';
        renderAuthorForm({}); 
        document.getElementById('authorModal').classList.add('active'); 
    }
    
    function editAuthor(id) { 
        if (!window.isAdmin()) {
            window.showToast('Bu işlem için admin yetkisi gerekli!', 'error');
            return;
        }
        console.log('editAuthor çağrıldı, id:', id);
        console.log('Mevcut yazarlar:', authorsData);
        
        // ID'yi string olarak karşılaştır (UUID)
        const author = authorsData.find(a => String(a.id) === String(id));
        
        if (!author) {
            console.error('Yazar bulunamadı! ID:', id);
            window.showToast('Yazar bulunamadı! ID: ' + id, 'error');
            return;
        }
        
        console.log('Düzenlenecek yazar:', author.name);
        editingAuthorId = id; 
        document.getElementById('authorModalTitle').innerHTML = '<i class="fas fa-edit"></i> Yazar Düzenle';
        renderAuthorForm(author); 
        document.getElementById('authorModal').classList.add('active'); 
    }
    
    function renderAuthorForm(data) {
        const body = document.getElementById('authorModalBody');
        body.innerHTML = `
            <div class="form-group">
                <label>Ad Soyad *</label>
                <input type="text" id="author_name" class="form-control" value="${window.escapeHtml(data.name || '')}" required>
            </div>
            <div class="form-group">
                <label>Unvan</label>
                <input type="text" id="author_title" class="form-control" value="${window.escapeHtml(data.title || '')}">
            </div>
            <div class="form-group">
                <label>E-posta *</label>
                <input type="email" id="author_email" class="form-control" value="${window.escapeHtml(data.email || '')}" required>
            </div>
            <div class="form-group">
                <label>Avatar (URL)</label>
                <input type="url" id="author_avatar" class="form-control" value="${window.escapeHtml(data.avatar || '')}">
            </div>
            <div class="form-group">
                <label>Biyografi</label>
                <textarea id="author_bio" rows="4" class="form-control">${window.escapeHtml(data.bio || '')}</textarea>
            </div>
        `;
    }

    async function saveAuthor() {
        if (!window.isAdmin()) {
            window.showToast('Bu işlem için admin yetkisi gerekli!', 'error');
            return;
        }
        
        const name = document.getElementById('author_name').value.trim();
        const email = document.getElementById('author_email').value.trim();
        
        if (!name) {
            window.showToast('Ad Soyad zorunludur', 'warning');
            return;
        }
        if (!email) {
            window.showToast('E-posta zorunludur', 'warning');
            return;
        }
        
        const authorData = {
            name: name,
            title: document.getElementById('author_title').value.trim() || null,
            email: email,
            avatar: document.getElementById('author_avatar').value.trim() || null,
            bio: document.getElementById('author_bio').value.trim() || null,
            updated_at: new Date().toISOString()
        };
        
        try {
            let result;
            if (editingAuthorId) {
                console.log('Yazar güncelleniyor, ID:', editingAuthorId);
                result = await window.supabaseClient
                    .from('authors')
                    .update(authorData)
                    .eq('id', editingAuthorId);
            } else {
                console.log('Yeni yazar ekleniyor');
                authorData.created_at = new Date().toISOString();
                result = await window.supabaseClient
                    .from('authors')
                    .insert([authorData]);
            }
            
            if (result.error) throw result.error;
            
            window.showToast(editingAuthorId ? 'Yazar güncellendi' : 'Yazar eklendi', 'success');
            closeAuthorModal();
            await loadAuthors();
            if (window.loadAppData) window.loadAppData();
        } catch (err) {
            console.error('Yazar kaydedilirken hata:', err);
            window.showToast('Hata: ' + err.message, 'error');
        }
    }

    async function deleteAuthor(id) {
        if (!window.isAdmin()) {
            window.showToast('Bu işlem için admin yetkisi gerekli!', 'error');
            return;
        }
        
        console.log('Yazar siliniyor, ID:', id);
        window.showDeleteConfirm('Bu yazarı silmek istediğinizden emin misiniz?', async () => {
            try {
                const { error } = await window.supabaseClient
                    .from('authors')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                
                window.showToast('Yazar silindi', 'success');
                await loadAuthors();
                if (window.loadAppData) window.loadAppData();
            } catch (err) {
                window.showToast('Hata: ' + err.message, 'error');
            }
        });
    }

    function closeAuthorModal() { 
        document.getElementById('authorModal').classList.remove('active'); 
        editingAuthorId = null;
    }
    
    // Sayfa dışına tıklandığında modal kapanmasın diye
    const authorModal = document.getElementById('authorModal');
    if (authorModal) {
        authorModal.addEventListener('click', function(e) {
            if (e.target === this) closeAuthorModal();
        });
    }
</script>
