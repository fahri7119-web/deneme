<div class="page-content">
    <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
        <h2 style="color: var(--primary-dark);"><i class="fas fa-video"></i> Videolar Yönetimi</h2>
        <button class="btn btn-primary" onclick="openVideoModal()"><i class="fas fa-plus"></i> Yeni Video</button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr style="background: var(--primary-bg);">
                        <th>#</th>
                        <th>Başlık</th>
                        <th>Açıklama</th>
                        <th>Video URL</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="videosTableBody">
                    <tr><td colspan="5" class="empty-state">Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="videoModal" class="modal" style="z-index: 4000;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div class="modal-title" id="videoModalTitle">Yeni Video</div>
                <button class="modal-close" onclick="closeVideoModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="videoModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeVideoModal()">İptal</button>
                <button class="btn btn-primary" onclick="saveVideo()">Kaydet</button>
            </div>
        </div>
    </div>
</div>

<script>
    let videosData = [];
    let editingVideoId = null;

    function initVideos() { 
        loadVideos(); 
    }

    async function loadVideos() {
        try {
            const { data, error } = await window.supabaseClient
                .from('videos')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            videosData = data || [];
            renderVideos();
        } catch (err) {
            console.error('Videolar yüklenirken hata:', err);
            window.showToast('Videolar yüklenemedi: ' + err.message, 'error');
            document.getElementById('videosTableBody').innerHTML = '<tr><td colspan="5" class="empty-state">Videolar yüklenemedi</td></tr>';
        }
    }

    function renderVideos() {
        const tbody = document.getElementById('videosTableBody');
        if (!videosData.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Henüz video yok. İlk videonuzu ekleyin!</td></tr>';
            return;
        }
        
        tbody.innerHTML = videosData.map((video, idx) => {
            // Video URL'yi kısaltarak göster
            let videoUrlDisplay = video.video_url || '-';
            if (videoUrlDisplay.length > 40) {
                videoUrlDisplay = videoUrlDisplay.substring(0, 40) + '...';
            }
            
            // Açıklamayı kısalt
            let descriptionDisplay = video.description || '-';
            if (descriptionDisplay.length > 60) {
                descriptionDisplay = descriptionDisplay.substring(0, 60) + '...';
            }
            
            return `
                <tr>
                    <td style="text-align: center; width: 50px;">${idx + 1}</td>
                    <td><strong>${window.escapeHtml(video.title) || '-'}</strong></td>
                    <td><small>${window.escapeHtml(descriptionDisplay)}</small></td>
                    <td>
                        ${video.video_url ? 
                            `<a href="${video.video_url}" target="_blank" style="color: var(--primary);"><i class="fas fa-external-link-alt"></i> İzle</a>` 
                            : '-'}
                    </td>
                    <td class="admin-only" style="white-space: nowrap;">
                        <button class="btn btn-secondary btn-small" onclick="editVideo('${video.id}')"><i class="fas fa-edit"></i> Düzenle</button>
                        <button class="btn btn-danger btn-small" onclick="deleteVideo('${video.id}')"><i class="fas fa-trash"></i> Sil</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function openVideoModal() { 
        editingVideoId = null; 
        document.getElementById('videoModalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Yeni Video';
        renderVideoForm({}); 
        document.getElementById('videoModal').classList.add('active'); 
    }
    
    function editVideo(id) { 
        const video = videosData.find(v => v.id === id); 
        if (!video) {
            window.showToast('Video bulunamadı', 'error');
            return;
        }
        editingVideoId = id; 
        document.getElementById('videoModalTitle').innerHTML = '<i class="fas fa-edit"></i> Video Düzenle';
        renderVideoForm(video); 
        document.getElementById('videoModal').classList.add('active'); 
    }
    
    function renderVideoForm(data) {
        const body = document.getElementById('videoModalBody');
        body.innerHTML = `
            <div class="form-group">
                <label>Başlık *</label>
                <input type="text" id="video_title" class="form-control" value="${window.escapeHtml(data.title || '')}" required>
            </div>
            <div class="form-group">
                <label>Açıklama</label>
                <textarea id="video_description" rows="3" class="form-control">${window.escapeHtml(data.description || '')}</textarea>
            </div>
            <div class="form-group">
                <label>Video URL *</label>
                <input type="url" id="video_url" class="form-control" value="${window.escapeHtml(data.video_url || '')}" placeholder="https://www.youtube.com/watch?v=..." required>
                <small style="color: var(--gray-500);">YouTube, Vimeo veya diğer video platformları için tam URL</small>
            </div>
            <div class="form-group">
                <label>Kapak Resmi (URL)</label>
                <input type="url" id="video_poster" class="form-control" value="${window.escapeHtml(data.poster || '')}" placeholder="https://...">
                <small style="color: var(--gray-500);">Video kapak görseli URL'i (opsiyonel)</small>
            </div>
        `;
    }

    async function saveVideo() {
        const title = document.getElementById('video_title').value.trim();
        const videoUrl = document.getElementById('video_url').value.trim();
        
        if (!title) {
            window.showToast('Başlık zorunludur', 'warning');
            return;
        }
        if (!videoUrl) {
            window.showToast('Video URL zorunludur', 'warning');
            return;
        }
        
        const videoData = {
            title: title,
            description: document.getElementById('video_description').value.trim() || null,
            video_url: videoUrl,
            poster: document.getElementById('video_poster').value.trim() || null,
            updated_at: new Date().toISOString()
        };
        
        try {
            let result;
            if (editingVideoId) {
                result = await window.supabaseClient
                    .from('videos')
                    .update(videoData)
                    .eq('id', editingVideoId);
            } else {
                videoData.created_at = new Date().toISOString();
                result = await window.supabaseClient
                    .from('videos')
                    .insert([videoData]);
            }
            
            if (result.error) throw result.error;
            
            window.showToast(editingVideoId ? 'Video güncellendi' : 'Video eklendi', 'success');
            closeVideoModal();
            loadVideos();
        } catch (err) {
            console.error('Video kaydedilirken hata:', err);
            window.showToast('Hata: ' + err.message, 'error');
        }
    }

    async function deleteVideo(id) {
        window.showDeleteConfirm('Bu videoyu silmek istediğinizden emin misiniz?', async () => {
            try {
                const { error } = await window.supabaseClient
                    .from('videos')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                
                window.showToast('Video silindi', 'success');
                loadVideos();
            } catch (err) {
                window.showToast('Hata: ' + err.message, 'error');
            }
        });
    }

    function closeVideoModal() { 
        document.getElementById('videoModal').classList.remove('active'); 
    }
</script>
