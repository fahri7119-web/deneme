name: Haber Sayfalarn Güncelle

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name:  Repository'yi indir
        uses: actions/checkout@v4
      
      - name:  Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name:  Bamllklar yükle
        run: npm install
      
      - name:  Haber sayfalarn olutur
        run: npm run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      
      - name:  Deiiklikleri kaydet
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add haber/
          git diff --staged --quiet || git commit -m " Haber sayfalar otomatik güncellendi [skip ci]"
          git push