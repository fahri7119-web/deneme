name: Haber Sayfalarını Güncelle

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: actions/setup-node@v4
        with:
          node-version: '22' 

      - run: npm install

      - run: npm run generate
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"

      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Hem 'haber' hem de 'yazilar' klasöründeki tüm yeni ve güncellenmiş dosyaları Git'e ekliyoruz
          git add haber/ yazilar/
          
          # Eğer değişiklik varsa commit et, yoksa geç
          git diff --staged --quiet || git commit -m "Update haber and yazilar pages [skip ci]"
          
          # Push yapmadan hemen önce uzak sunucudaki güncel değişiklikleri çek ve birleştir
          git pull origin main --rebase
          
          # Değişiklikleri ana depoya gönder
          git push origin main
