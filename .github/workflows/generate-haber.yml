name: Haber Sayfalarını Güncelle

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

# 🔑 BUNU EKLE - Yazma izni ver
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Repository'yi indir
        uses: actions/checkout@v4
      
      - name: 🔧 Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 Bağımlılıkları yükle
        run: npm install
      
      - name: 🚀 Haber sayfalarını oluştur
        run: npm run generate
        env:
          SUPABASE_URL: ${{ https://tmtdpykzmdvxszxwyege.supabase.co }}
          SUPABASE_ANON_KEY: ${{ sb_publishable_3S4Qryj5TCI4IDASoxisVw_Y9eoso2F }}
      
      - name: 📤 Değişiklikleri kaydet
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add haber/
          git diff --staged --quiet || git commit -m "🔄 Haber sayfaları otomatik güncellendi [skip ci]"
          git push
