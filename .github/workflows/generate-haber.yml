name: Haber Sayfalarını Güncelle

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm run generate
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Değişiklikleri ekle
          git add haber/ yazilar/
          
          # Eğer değişiklik varsa commit et
          if ! git diff --staged --quiet; then
            git commit -m "Update haber and yazilar pages [skip ci]"
          fi
          
          # Önce uzaktaki değişiklikleri çek (rebase yok)
          git pull origin main --no-rebase --ff-only || true
          
          # Değişiklikleri pushla
          git push origin main
